<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><title>Fit Studio — Entraînements</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f3f6fa;background:#10151e}*{box-sizing:border-box}body{margin:0}main{max-width:600px;margin:auto;padding:22px 18px 100px}header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 20px}header strong{font-size:23px;letter-spacing:-.8px}header strong span{color:#7beaaf}.muted{color:#9eabbc}.eyebrow{color:#7beaaf;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:32px;letter-spacing:-1px;margin:12px 0}h2{font-size:23px;margin:12px 0}h3{margin:5px 0 8px}.panel{background:#1c2532;border:1px solid #344152;border-radius:20px;padding:18px;margin:14px 0}.hero{background:linear-gradient(125deg,#194d3f,#202b42);padding:22px;border-radius:22px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1}button{font:inherit;border:1px solid #3d4c60;background:#2b394c;color:#fff;border-radius:13px;padding:12px 15px;cursor:pointer;font-weight:700}button:focus-visible{outline:3px solid #7beaaf}button.active,.primary{background:#4cd695;color:#0b211a;border-color:#4cd695}.primary{width:100%}.subtle{background:#1a2533}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stat{font-size:27px;font-weight:850}.small{font-size:13px}.exercise{padding:16px 0;border-top:1px solid #354052}.illustration{height:130px;background:radial-gradient(circle at 50% 45%,#27463f,#17202d);border-radius:16px;display:flex;justify-content:center;align-items:center;overflow:hidden;margin:12px 0}.illustration svg{height:120px;width:170px}.move-curl{transform-origin:87px 47px;animation:curl 2s ease-in-out infinite alternate}.move-press{animation:press 2s ease-in-out infinite alternate}.move-pull{animation:pull 2s ease-in-out infinite alternate}.move-row{animation:row 2s ease-in-out infinite alternate}.move-push{animation:push 2s ease-in-out infinite alternate}.move-lower{animation:lower 2s ease-in-out infinite alternate}@keyframes curl{to{transform:translateY(-13px)}}@keyframes press{to{transform:translateY(-16px)}}@keyframes pull{to{transform:translateY(16px)}}@keyframes row{to{transform:translateX(-10px)}}@keyframes push{to{transform:translateX(10px)}}@keyframes lower{to{transform:translateY(13px)}}@media(prefers-reduced-motion:reduce){.illustration g{animation:none!important}}.setbuttons{display:flex;gap:8px;flex-wrap:wrap}.setbuttons button{flex:1;min-width:74px}.setbuttons .done{background:#4cd695;color:#10261d}.timer{position:sticky;top:10px;z-index:4;background:#2c7659;border:1px solid #7beaaf;border-radius:16px;padding:14px;text-align:center;margin-bottom:12px}.hidden,[hidden]{display:none!important}nav{position:fixed;bottom:0;left:0;right:0;background:#151e29;border-top:1px solid #354052;display:flex;justify-content:center;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom))}nav button{font-size:12px;min-width:0;flex:1;border:0;background:transparent}nav button.active{background:#27463b;color:#8cf0b6}.field{width:100%;background:#111923;border:1px solid #4a5b6e;border-radius:12px;padding:13px;color:white;font:inherit}.filters{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}.filters button{white-space:nowrap;font-size:13px;padding:9px 12px}.notice{font-size:12px;color:#aab7c8;line-height:1.5}
</style></head><body><main><header><strong>FIT <span>STUDIO</span></strong><span class="eyebrow">BÊTA</span></header><div id="timer" class="timer hidden" aria-live="polite"></div><div id="app"></div></main><nav aria-label="Navigation"><button data-action="page" data-page="workouts">🏋️ Séances</button><button data-action="page" data-page="catalog">📚 Exercices</button><button data-action="page" data-page="history">📈 Historique</button><button data-action="page" data-page="profile">👤 Profil</button></nav>
<script>
'use strict';
const programs={
 home:[{name:'Haut du corps',ex:['Pompes inclinées','Rowing avec sac','Développé épaules','Curl biceps']},{name:'Bas du corps',ex:['Squats','Fentes arrière','Pont fessier','Mollets debout']},{name:'Corps entier',ex:['Squats','Pompes au mur','Rowing avec sac','Planche']}],
 gym:[{name:'Haut du corps',ex:['Développé poitrine machine','Tirage vertical','Développé épaules machine','Curl à la poulie']},{name:'Bas du corps',ex:['Presse à cuisses','Leg curl','Leg extension','Mollets machine']},{name:'Corps entier',ex:['Presse à cuisses','Développé poitrine machine','Rowing assis','Crunch machine']}]
};
const key='fitstudio-v2';let stored={};try{stored=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}
let state={page:'workouts',mode:stored.mode==='gym'?'gym':'home',active:null,selectedExercise:null,filter:'Tous',done:{},weight:{},rest:0,interval:null,profile:stored.profile||{name:'Sportif',goal:'Prendre du muscle'}};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify({mode:state.mode,profile:state.profile,history:stored.history||[]}))}catch(e){console.warn('Stockage indisponible',e)}}

const movementLibrary={
'Pompes inclinées':['push','Pompes inclinées : corps gainé, poitrine vers le support'],
'Pompes au mur':['push','Pompes au mur : fléchir puis tendre les bras'],
'Rowing avec sac':['row','Rowing : tirer la charge vers le nombril'],
'Rowing assis':['row','Rowing assis : ramener les poignées vers le buste'],
'Développé épaules':['press','Développé épaules : pousser les mains vers le plafond'],
'Développé épaules machine':['press','Développé épaules machine : pousser verticalement'],
'Curl biceps':['curl','Curl biceps : fléchir les coudes sans balancer'],
'Curl à la poulie':['curl','Curl à la poulie : fléchir les coudes'],
'Squats':['squat','Squat : descendre les hanches et remonter'],
'Fentes arrière':['lunge','Fente arrière : reculer une jambe et fléchir les genoux'],
'Pont fessier':['bridge','Pont fessier : soulever les hanches'],
'Mollets debout':['calf','Mollets : monter sur la pointe des pieds'],
'Mollets machine':['calf','Mollets machine : monter les talons'],
'Planche':['plank','Planche : garder le corps aligné sans bouger'],
'Développé poitrine machine':['chest','Développé poitrine : pousser les poignées devant soi'],
'Tirage vertical':['pulldown','Tirage vertical : descendre la barre vers le haut de la poitrine'],
'Presse à cuisses':['legpress','Presse à cuisses : pousser la plateforme avec les pieds'],
'Leg curl':['legcurl','Leg curl : plier les genoux contre la résistance'],
'Leg extension':['legext','Leg extension : tendre les genoux'],
'Crunch machine':['crunch','Crunch machine : rapprocher le thorax du bassin']
};
function illustration(name){
 const [type,description]=movementLibrary[name]||['unknown','Démonstration indisponible'];
 const stroke='#90f0b7',equipment='#c5d4e2';
 const line=(d,color=stroke,w=8)=>'<path d="'+d+'" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
 const circle=(x,y,r=10)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+stroke+'"/>';
 const staticFigure=circle(87,23)+line('M87 37V79 M87 79L60 116 M87 79L114 116');
 let moving='',gear='';
 if(type==='curl'){moving='<g class="move-curl">'+line('M87 47L64 72L54 51 M87 47L110 72L120 51')+line('M44 47H64 M110 47H130',equipment,5)+'</g>'}
 else if(type==='press'){moving='<g class="move-press">'+line('M87 44L61 54L57 26 M87 44L113 54L117 26')+line('M45 20H129',equipment,5)+'</g>'}
 else if(type==='pulldown'){gear=line('M40 9H134 M43 9V29 M131 9V29',equipment,4);moving='<g class="move-pull">'+line('M87 45L55 48L44 29 M87 45L119 48L130 29')+line('M40 29H134',equipment,5)+'</g>'}
 else if(type==='row'){moving='<g class="move-row">'+line('M87 45L58 64L46 53 M87 45L116 64L128 53')+line('M40 52H135',equipment,5)+'</g>'}
 else if(type==='push'||type==='chest'){moving='<g class="move-push">'+line('M87 47L59 51L43 44 M87 47L115 51L131 44')+line('M30 44H145',equipment,5)+'</g>'}
 else if(type==='squat'||type==='lunge'||type==='legpress'||type==='legcurl'||type==='legext'||type==='calf'||type==='bridge'||type==='crunch'||type==='plank'){
 const pose={
 squat:line('M87 37L87 70L61 85L47 111 M87 70L112 85L126 111 M87 46L58 62 M87 46L115 62'),
 lunge:line('M87 37L87 70L55 91L45 114 M87 70L115 89L132 90 M87 46L58 61 M87 46L115 61'),
 legpress:line('M55 55L90 75L116 53 M90 75L126 95')+line('M133 25V112',equipment,6),
 legcurl:line('M87 37L87 70L60 89L47 69 M87 70L113 88L128 69'),
 legext:line('M87 37L87 70L55 82L26 82 M87 70L113 82L142 82'),
 calf:line('M87 37L87 78L61 111L53 111 M87 78L113 111L121 111'),
 bridge:line('M32 97L65 91L93 62L126 94 M126 94L145 100'),
 crunch:line('M47 100L73 80L95 73L120 101'),
 plank:line('M26 85L60 85L102 75L143 85')
 }[type];
 moving='<g class="move-lower">'+pose+'</g>';
 }else{moving=line('M87 47L58 70 M87 47L116 70')}
 const isLower=['squat','lunge','legpress','legcurl','legext','calf','bridge','crunch','plank'].includes(type);
 const figure=isLower?circle(87,23)+moving:staticFigure+moving;
 return '<div class="illustration" role="img" aria-label="'+esc(description)+'"><svg viewBox="0 0 175 130" aria-hidden="true">'+gear+figure+line('M18 121H157','#53697d',3)+'</svg></div><p class="notice">'+esc(description)+' · Schéma animé simplifié (non une démonstration technique complète).</p>';
}
const muscleGroups={
'Pompes inclinées':'Pectoraux','Pompes au mur':'Pectoraux','Développé poitrine machine':'Pectoraux',
'Rowing avec sac':'Dos','Rowing assis':'Dos','Tirage vertical':'Dos',
'Développé épaules':'Épaules','Développé épaules machine':'Épaules',
'Curl biceps':'Bras','Curl à la poulie':'Bras',
'Squats':'Jambes','Fentes arrière':'Jambes','Presse à cuisses':'Jambes','Leg curl':'Jambes','Leg extension':'Jambes','Mollets debout':'Jambes','Mollets machine':'Jambes',
'Pont fessier':'Fessiers','Planche':'Abdominaux','Crunch machine':'Abdominaux'
};
const allExercises=Object.keys(movementLibrary);
function catalogView(){
 if(state.selectedExercise){
 const name=state.selectedExercise;
 app.innerHTML='<button class="subtle" data-action="catalogback">← Tous les exercices</button><p class="eyebrow">'+esc(muscleGroups[name])+'</p><h1>'+esc(name)+'</h1><section class="panel">'+illustration(name)+'<h3>Consignes</h3><p>'+esc(movementLibrary[name][1])+'</p><p class="notice">Garde un mouvement contrôlé et une amplitude confortable. Le schéma est indicatif et ne remplace pas une démonstration technique vérifiée.</p></section>';
 return;
 }
 const groups=['Tous','Pectoraux','Dos','Épaules','Bras','Jambes','Fessiers','Abdominaux'];
 const items=allExercises.filter(n=>state.filter==='Tous'||muscleGroups[n]===state.filter);
 app.innerHTML='<p class="eyebrow">Bibliothèque</p><h1>Exercices</h1><p class="muted">'+allExercises.length+' exercices · filtrer par muscle</p><div class="filters">'+groups.map(g=>'<button data-action="filter" data-filter="'+esc(g)+'" class="'+(g===state.filter?'active':'')+'">'+esc(g)+'</button>').join('')+'</div>'+items.map(n=>'<section class="panel"><div class="row"><div><span class="eyebrow">'+esc(muscleGroups[n])+'</span><h3>'+esc(n)+'</h3></div><button data-action="detail" data-name="'+esc(n)+'" aria-label="Voir '+esc(n)+'">Voir →</button></div></section>').join('');
}
function view(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));if(state.page==='workouts'){if(state.active!==null){const p=programs[state.mode][state.active];app.innerHTML='<button class="subtle" data-action="back">← Programmes</button><p class="eyebrow">'+(state.mode==='gym'?'Salle':'Maison')+'</p><h1>'+esc(p.name)+'</h1><p class="muted">3 séries par exercice · 60 s de repos</p>'+p.ex.map((name,i)=>'<section class="panel"><span class="eyebrow">EXERCICE '+(i+1)+'</span><h2>'+esc(name)+'</h2>'+illustration(name)+'<p>3 × 10–12 répétitions</p><label class="small muted">Charge (kg, facultatif)</label><input class="field" inputmode="decimal" type="number" min="0" step=".5" data-weight="'+i+'" value="'+esc(state.weight[i]||'')+'" placeholder="0"><p class="small muted">Valider les séries :</p><div class="setbuttons">'+[0,1,2].map(k=>'<button data-action="set" data-i="'+i+'" data-k="'+k+'" class="'+(state.done[i+'-'+k]?'done':'')+'">'+(state.done[i+'-'+k]?'✓ ':'')+'Série '+(k+1)+'</button>').join('')+'</div></section>').join('')+'<button class="primary" data-action="finish">✓ Terminer et enregistrer</button>'}else{app.innerHTML='<section class="hero"><p class="eyebrow">Ton espace sportif</p><h1>Prêt pour ta séance ?</h1><p>Choisis ton environnement et commence à progresser.</p></section><div class="tabs"><button data-action="mode" data-mode="home" class="'+(state.mode==='home'?'active':'')+'">🏠 Maison</button><button data-action="mode" data-mode="gym" class="'+(state.mode==='gym'?'active':'')+'">🏋️ Salle</button></div><h2>Programmes</h2>'+programs[state.mode].map((p,i)=>'<section class="panel"><div class="row"><div><span class="eyebrow">'+(i===0?'Force':i===1?'Musculation':'Équilibre')+'</span><h3>'+esc(p.name)+'</h3><p class="small muted">'+p.ex.length+' exercices · environ 25 min</p></div><span class="stat">0'+(i+1)+'</span></div><button class="primary" data-action="start" data-i="'+i+'">Commencer →</button></section>').join('')}}else if(state.page==='catalog'){catalogView()}else if(state.page==='history'){const h=stored.history||[];app.innerHTML='<p class="eyebrow">Tes progrès</p><h1>Historique</h1><section class="panel"><div class="row"><div><span class="muted small">Séances réalisées</span><div class="stat">'+h.length+'</div></div><div><span class="muted small">Séries validées</span><div class="stat">'+h.reduce((s,x)=>s+x.sets,0)+'</div></div></div></section>'+(!h.length?'<p class="muted">Aucune séance enregistrée pour le moment.</p>':h.map(x=>'<section class="panel"><h3>'+esc(x.name)+'</h3><p class="muted">'+esc(x.date)+' · '+(x.mode==='gym'?'Salle':'Maison')+' · '+x.sets+' séries</p></section>').join(''))}else{app.innerHTML='<p class="eyebrow">Mon compte</p><h1>Profil</h1><section class="panel"><label>Prénom ou pseudo</label><input class="field" id="name" maxlength="40" value="'+esc(state.profile.name)+'"><p><label>Objectif</label></p><select class="field" id="goal"><option>Prendre du muscle</option><option>Perdre du gras</option><option>Rester en forme</option></select><p><button class="primary" data-action="saveprofile">Enregistrer mon profil</button></p><p class="notice">Données enregistrées uniquement sur cet appareil. Pas de compte en ligne pour cette bêta.</p></section>';document.getElementById('goal').value=state.profile.goal}}
function stop(){if(state.interval)clearInterval(state.interval);state.interval=null;state.rest=0;document.getElementById('timer').classList.add('hidden')}
function rest(){stop();state.rest=60;const el=document.getElementById('timer');el.classList.remove('hidden');function update(){el.textContent='⏱️ Repos : '+Math.floor(state.rest/60)+':'+String(state.rest%60).padStart(2,'0')+'  ·  Appuie pour arrêter';if(state.rest<=0)stop();else state.rest--}update();state.interval=setInterval(update,1000)}
document.getElementById('timer').addEventListener('click',stop);
document.addEventListener('input',e=>{if(e.target.dataset.weight!==undefined)state.weight[e.target.dataset.weight]=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;if(a==='page'){stop();state.page=b.dataset.page;state.active=null;state.selectedExercise=null}else if(a==='filter'){state.filter=b.dataset.filter}else if(a==='detail'){state.selectedExercise=b.dataset.name}else if(a==='catalogback'){state.selectedExercise=null}else if(a==='mode'){state.mode=b.dataset.mode;save()}else if(a==='start'){state.active=Number(b.dataset.i);state.done={};state.weight={}}else if(a==='back'){state.active=null;stop()}else if(a==='set'){const k=b.dataset.i+'-'+b.dataset.k;state.done[k]=!state.done[k];if(state.done[k])rest()}else if(a==='finish'){const n=Object.values(state.done).filter(Boolean).length;if(!n){alert('Valide au moins une série avant de terminer.');return}const p=programs[state.mode][state.active];stored.history=stored.history||[];stored.history.unshift({name:p.name,mode:state.mode,sets:n,date:new Date().toLocaleDateString('fr-BE'),weights:{...state.weight}});save();stop();state.active=null;state.page='history';alert('Bravo ! Séance enregistrée.')}else if(a==='saveprofile'){state.profile={name:document.getElementById('name').value.trim()||'Sportif',goal:document.getElementById('goal').value};save();alert('Profil enregistré sur cet appareil.')}view()});
view();
</script></body></html>
