<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1320"><title>Fit Studio · Démo Safari</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1320;color:#f2f6fa;font:16px system-ui}main{max-width:560px;margin:auto;padding:22px 18px 80px}header{color:#67e8b5;letter-spacing:3px;font-weight:900;padding:14px 0}h1{font-size:32px;margin:20px 0 4px}h2{font-size:22px}p,small{color:#b7c7d7;line-height:1.5}.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}button{cursor:pointer;border:1px solid #34465a;border-radius:14px;padding:14px;color:white;background:#24364b;font-weight:700;font-size:15px}button.on,.go{background:#1a775b;border-color:#65e8b3}.card{border:1px solid #33445a;background:#172538;border-radius:20px;padding:18px;margin:14px 0}.card h3{margin:0 0 5px}.tag{color:#67e8b5;font-weight:800;font-size:13px}.sets{display:flex;gap:8px;flex-wrap:wrap}.sets button{padding:12px}.sets button.done{background:#1a775b}.go{width:100%;margin-top:12px}.photo{height:145px;border-radius:13px;background-size:cover;background-position:center;margin-bottom:12px}.note{background:#223246;border-radius:12px;padding:12px;margin:10px 0;color:#cbd7e4;font-size:13px}#timer{position:sticky;top:0;background:#1c5645;padding:12px;border-radius:14px;display:none;z-index:2;text-align:center}</style><main><header>FIT STUDIO</header><section id="home"><h1>Ton entraînement</h1><p>Choisis où tu veux t'entraîner, puis lance une séance.</p><div class="modes"><button id="homeBtn" class="on" onclick="mode='home';render()">🏠 À la maison</button><button id="gymBtn" onclick="mode='gym';render()">🏋️ À la salle</button></div><h2>Programmes</h2><div id="programs"></div><button onclick="historyView()">📊 Mon historique</button></section><section id="session" hidden><button onclick="show('home')">← Programmes</button><h1 id="title"></h1><p id="sub"></p><div id="timer"></div><div id="exercises"></div><button class="go" onclick="finish()">Terminer la séance</button></section><section id="history" hidden><button onclick="show('home')">← Retour</button><h1>Mon historique</h1><div id="records"></div></section></main><script>
let mode='home',selected=null,completed={},seconds=0,tick=null;
const data={home:[['Haut du corps','Pompes inclinées|Rowing avec sac à dos|Développé épaules avec bouteilles|Curl biceps avec bouteilles'],['Bas du corps','Squats au poids du corps|Fentes arrière|Pont fessier|Mollets debout'],['Corps entier','Squats|Pompes contre un mur|Rowing avec sac à dos|Planche']],gym:[['Haut du corps','Chest press guidée|Tirage vertical à la poulie|Shoulder press machine|Curl biceps à la poulie'],['Bas du corps','Presse à cuisses|Leg curl assis|Leg extension|Mollets à la machine'],['Corps entier','Presse à cuisses|Chest press guidée|Rowing assis à la poulie|Crunch à la machine']]};
const photos={home:['https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=900&q=80','https://images.unsplash.com/photo-1599058917212-d750089bc07e?w=900&q=80','https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=900&q=80'],gym:['https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=900&q=80','https://images.unsplash.com/photo-1576678927484-cc907957088c?w=900&q=80','https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=900&q=80']};
function show(s){for(const x of ['home','session','history'])document.getElementById(x).hidden=x!==s;if(s!=='session')stopTimer()}
function render(){document.getElementById('homeBtn').classList.toggle('on',mode==='home');document.getElementById('gymBtn').classList.toggle('on',mode==='gym');document.getElementById('programs').innerHTML=data[mode].map((p,i)=>'<div class="card"><div class="photo" style="background-image:url('+photos[mode][i]+')"></div><small>Photo d’ambiance</small><h3>'+p[0]+'</h3><p>'+p[1].split('|').length+' exercices · '+(mode==='home'?'Sans machine':'Avec machines')+'</p><button class="go" onclick="start('+i+')">Commencer →</button></div>').join('')}
function start(i){selected={mode,name:data[mode][i][0],ex:data[mode][i][1].split('|')};completed={};document.getElementById('title').textContent=selected.name;document.getElementById('sub').textContent=mode==='home'?'🏠 À la maison':'🏋️ À la salle';document.getElementById('exercises').innerHTML=selected.ex.map((name,j)=>'<div class="card"><span class="tag">EXERCICE '+(j+1)+'</span><h2>'+name+'</h2><div class="note">📷 Photos réelles du mouvement (départ et arrivée) à intégrer après vérification. Ne pas confondre avec les photos d’ambiance des programmes.</div><p>3 séries · 10–12 répétitions · 60 s de repos</p><div class="sets">'+[0,1,2].map(k=>'<button id="set'+j+'-'+k+'" onclick="toggle('+j+','+k+')">Série '+(k+1)+'</button>').join('')+'</div></div>').join('');show('session')}
function toggle(j,k){let key=j+'-'+k;completed[key]=!completed[key];document.getElementById('set'+key).classList.toggle('done',completed[key]);if(completed[key])rest(60)}
function rest(n){seconds=n;clearInterval(tick);const el=document.getElementById('timer');el.style.display='block';const update=()=>{el.textContent='⏱️ Repos : '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(seconds<=0)stopTimer();else seconds--};update();tick=setInterval(update,1000)}
function stopTimer(){clearInterval(tick);document.getElementById('timer').style.display='none'}
function finish(){const n=Object.values(completed).filter(Boolean).length;if(!n)return alert('Valide au moins une série.');let h=JSON.parse(localStorage.getItem('fitstudio-web-history')||'[]');h.unshift({name:selected.name,mode:selected.mode,sets:n,date:new Date().toLocaleDateString('fr-FR')});localStorage.setItem('fitstudio-web-history',JSON.stringify(h));alert('Bravo ! Séance enregistrée sur cet appareil.');show('home')}
function historyView(){let h=JSON.parse(localStorage.getItem('fitstudio-web-history')||'[]');document.getElementById('records').innerHTML=h.length?h.map(x=>'<div class="card"><h3>'+x.name+'</h3><p>'+(x.mode==='home'?'Maison':'Salle')+' · '+x.date+' · '+x.sets+' séries</p></div>').join(''):'<p>Aucune séance enregistrée.</p>';show('history')}render();
</script></html>
