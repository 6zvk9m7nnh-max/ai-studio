name: Publish Fit Studio Safari demo
on:
  push:
    branches: [feat/fitness-mobile-mvp]
    paths: ['fitness-web/**', '.github/workflows/fitness-web-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fitness-web-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fitness-web
      - id: deployment
        uses: actions/deploy-pages@v4
